name: Update procedures (FAA CIFP)

on:
  schedule:
    - cron: '23 9 * * *'   # daily check; only commits when a new 28-day cycle is out
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and build
        run: python tools/update_cifp.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/procs data/nav.json)" ]; then
            git config user.name "route-desk-bot"
            git config user.email "route-desk-bot@users.noreply.github.com"
            git add -A data/procs data/nav.json
            git commit -m "Update procedures to CIFP cycle $(python -c "import json;print(json.load(open('data/procs/index.json'))['cycle'])")"
            git push
          else
            echo "Procedures already current"
          fi
