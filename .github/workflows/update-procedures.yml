name: Update procedures (FAA CIFP)

on:
  schedule:
    - cron: '23 9 * * *'   # daily check; only commits when a new 28-day cycle is out
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and build procedures
        run: python tools/update_cifp.py
      - name: Download and build preferred routes
        continue-on-error: true
        run: |
          curl -fsSL -A "route-desk (personal flight-sim planner)" -o /tmp/prefroutes_db.csv https://www.fly.faa.gov/rmt/data_file/prefroutes_db.csv
          python tools/build_prefroutes.py /tmp/prefroutes_db.csv data/prefroutes.json
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/procs data/nav.json data/prefroutes.json)" ]; then
            git config user.name "route-desk-bot"
            git config user.email "route-desk-bot@users.noreply.github.com"
            git add -A data/procs data/nav.json data/prefroutes.json
            git commit -m "Update nav data, CIFP cycle $(python -c "import json;print(json.load(open('data/procs/index.json'))['cycle'])")"
            git push
          else
            echo "Procedures already current"
          fi
