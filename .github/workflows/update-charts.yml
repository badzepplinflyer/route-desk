name: Update charts (FAA d-TPP)

on:
  schedule:
    - cron: '41 10 * * *'   # daily; commits only when the chart list changes (new cycle or chart changes)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_charts.py
      - .github/workflows/update-charts.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build chart lists
        run: python tools/build_charts.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/charts)" ]; then
            git config user.name "route-desk-bot"
            git config user.email "route-desk-bot@users.noreply.github.com"
            git add -A data/charts
            git commit -m "Update chart lists, d-TPP cycle $(python -c "import json;print(json.load(open('data/charts/index.json'))['cycle'])")"
            git pull --rebase origin main
            git push
          else
            echo "Chart lists already current"
          fi
